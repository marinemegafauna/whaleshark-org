# Whale shark (Rhincodon typus) scar schema — v2.0
# Research fields implement the published MMF scar-classification method, v0.1
# (Prebble, Pierce & Rohner 2026, github.com/marinemegafauna/whale-shark-scar-classification,
# METHOD.md Section 2): anthropogenic status, threat, cause, confidence, severity,
# body region (+ side/edge detail) and number of distinct scars, with the observer's
# verbatim description kept separate from the coder's interpretation (Section 3.1) and
# the observation channel recorded per row (Section 3.6). Rows are one per distinct scar
# per encounter; the explicit "examined, no scar" zero is recorded on the encounter review
# (regions examined), matching the template's examined_clean row type (Section 4).
# Two additions beyond the method: `healing_stage` (open / closing / healed by tissue
# state, Womersley et al. 2021 — proposed to the method repo as an optional axis) and
# `description` / `notes` as separate free-text fields.
# Owner of terminology: Clare Prebble. Change wording here; every site's form follows.
# Option ids map to the method's codes in the option help text (Y/A/N/U etc.) so a
# CSV export (/api/scars/export.csv) drops straight into templates/scar_records_template.csv.
id: whale-shark
version: "2.0"
common_name: Whale shark
scientific_name: Rhincodon typus
wildbook_taxonomy: "Rhincodon typus"
text_hints:
  # Order matters: a later hint overwrites an earlier one. Wound words (cause K) come
  # first so an observer-NAMED cause overwrites them (METHOD 3.1: named causes stand,
  # bare wound words are never upgraded); generic regions (dorsal, caudal) come before the
  # specific ones (2nd dorsal, peduncle) for the same reason. Hints only preselect.
  - { pattern: '\b(?:nick|notch|\bcut|lacer)', values: { severity: moderate } }
  - { pattern: "amput|missing|deep|open wound", values: { severity: major } }
  - { pattern: '\b(?:nick|notch|\bcut|lacer|missing|amput)', values: { cause: cut_unstated, confidence: possible } }
  - { pattern: "abras|scrap|scratch|denticle", values: { anthropogenic: abrasion, threat: contact, cause: contact, confidence: possible, severity: minor } }
  - { pattern: 'cookie|remora|orca|predat|shark bite|\bbite', values: { anthropogenic: natural, threat: natural, cause: natural, confidence: probable } }
  - { pattern: '\b(?:tag|biops|tether|clamp)', values: { anthropogenic: "yes", threat: scientific, cause: scientific, confidence: probable } }
  - { pattern: "knife|gaff", values: { anthropogenic: "yes", threat: human_other, cause: human_other, confidence: probable } }
  - { pattern: '\b(?:net|rope|fishing[ -]?line|\bline\b|hook|entangl)', values: { anthropogenic: "yes", threat: fisheries, cause: entanglement, confidence: probable } }
  - { pattern: 'vessel|boat strike|\bstrike|\bhull|boat paint', values: { anthropogenic: "yes", threat: vessel, cause: strike, confidence: probable } }
  - { pattern: "prop", values: { anthropogenic: "yes", threat: vessel, cause: propeller, confidence: probable } }
  - { pattern: "head|snout", values: { body_region: head } }
  - { pattern: "gill", values: { body_region: gills } }
  - { pattern: 'mouth|\bjaw', values: { body_region: mouth } }
  - { pattern: "clasper", values: { body_region: claspers } }
  - { pattern: "pectoral", values: { body_region: pectoral_fin } }
  - { pattern: "dorsal", values: { body_region: dorsal_fin_1 } }
  - { pattern: "2nd dorsal|second dorsal", values: { body_region: dorsal_fin_2 } }
  - { pattern: "ventral|belly|underside", values: { body_region: ventral_surface } }
  - { pattern: "anterior flank|front flank|forward flank", values: { body_region: flank_anterior } }
  - { pattern: "posterior flank|rear flank|back flank|hind flank|behind (?:the )?(?:1st |first )?dorsal", values: { body_region: flank_posterior } }
  # bare "flank"/"side" deliberately NOT pre-filled: the anterior/posterior split matters
  # to the method's anatomical result and a silent default would bias legacy text
  - { pattern: "pelvic", values: { body_region: pelvic_fin } }
  - { pattern: "caudal|tail", values: { body_region: caudal_fin } }
  - { pattern: "peduncle", values: { body_region: caudal_peduncle } }
  - { pattern: '\btip\b', values: { region_detail: tip } }
  - { pattern: '\bleft\b', values: { region_detail: left } }
  - { pattern: '\bright\b', values: { region_detail: right } }
  - { pattern: "leading edge", values: { region_detail: leading_edge } }
  - { pattern: "trailing edge", values: { region_detail: trailing_edge } }
  - { pattern: "upper (?:lobe|caudal)", values: { region_detail: upper_lobe } }
  - { pattern: "lower (?:lobe|caudal)", values: { region_detail: lower_lobe } }
  - { pattern: 'fresh|bleed|open wound|\bred\b|pink', values: { healing_stage: open } }
  - { pattern: "healing|closing|white", values: { healing_stage: closing } }
  - { pattern: "healed|black scar", values: { healing_stage: healed } }
public_report:
  version: "1.0"
  submit_label: Save sighting details
  saved_label: Sighting details saved.
  choose_label: Choose…
  units_label: "{field} units"
  groups:
    - id: when_where
      label: When and where
      help: Tell us where and when you met the shark.
      fields:
        - id: observed_date
          label: Encounter date
          type: date
          required: true
          default: today
          help: Taken from the photo when available; otherwise today.
        - id: observed_time
          label: Time
          type: text
          required: false
          placeholder: "14:30"
          help: Optional local time, using 24-hour time.
        - id: site_id
          label: Site
          type: select
          required: true
          options_source: sites
          options:
            - { id: other, label: Other / not listed }
        - id: verbatim_locality
          label: Where were you?
          type: text
          required: true
          placeholder: Dive site, island or nearest place
          show_when: { field: site_id, equals: other }
        - id: decimal_latitude
          label: Latitude
          type: number
          required: false
          min: -90
          max: 90
          step: 0.000001
          placeholder: "-15.942300"
        - id: decimal_longitude
          label: Longitude
          type: number
          required: false
          min: -180
          max: 180
          step: 0.000001
          placeholder: "40.748100"
        - id: depth
          label: Sea-floor depth
          type: number
          required: false
          min: 0
          step: 0.1
          units:
            - { id: m, label: m }
          default_unit: m
    - id: about_shark
      label: About the shark
      help: What could you see in the water?
      fields:
        - id: sex
          label: Sex
          type: chips
          required: true
          default: unknown
          options:
            - { id: male, label: Male }
            - { id: female, label: Female }
            - { id: unknown, label: Unknown }
        - id: life_stage
          label: Life stage
          type: chips
          required: true
          default: unknown
          options:
            - { id: neonate, label: Neonate }
            - { id: juvenile, label: Juvenile }
            - { id: sub-adult, label: Sub-adult }
            - { id: adult, label: Adult }
            - { id: adult-pregnant, label: "Adult, pregnant" }
            - { id: unknown, label: Unknown }
        - id: length
          label: Total length
          type: number
          required: false
          min: 0
          step: 0.1
          units:
            - { id: m, label: m }
            - { id: ft, label: ft }
          default_unit: m
          estimated_toggle: This is an estimate
          estimated_default: true
          help: Nose to tail.
        - id: behavior
          label: Behaviour
          type: chips
          required: false
          multiple: true
          options:
            - { id: feeding_surface, label: Feeding at surface }
            - { id: feeding_water_column, label: Feeding in water column }
            - { id: swimming, label: Swimming }
            - { id: resting, label: Resting }
            - { id: other_sharks, label: With other sharks }
            - { id: vessel_nearby, label: With a boat/vessel nearby }
            - { id: other, label: Other }
        - id: living_status
          label: Status
          type: chips
          required: true
          default: alive
          options:
            - { id: alive, label: Alive }
            - { id: dead, label: Dead }
        - id: individual_count
          label: Number of sharks seen on this dive
          type: number
          required: true
          default: 1
          min: 1
          step: 1
    - id: injuries
      label: Injuries and scars
      help: A simple public observation; researchers will classify scars separately.
      fields:
        - id: injury_severity
          label: Noticeable injuries or scars?
          type: chips
          required: true
          default: none
          options:
            - { id: none, label: None seen }
            - { id: minor, label: "Yes, minor" }
            - { id: major, label: "Yes, major" }
        - id: injury_regions
          label: Where?
          type: chips
          required: false
          multiple: true
          options_source: body_region
          show_when: { field: injury_severity, not_equals: none }
        - id: injury_types
          label: What did it look like?
          type: chips
          required: false
          multiple: true
          options:
            - { id: fresh_wound, label: Fresh wound }
            - { id: healed_scar, label: Healed scar }
            - { id: fin_damage, label: Fin missing or damaged }
            - { id: rope_net, label: Rope or net marks }
            - { id: propeller, label: Propeller cuts }
            - { id: other, label: Other }
          show_when: { field: injury_severity, not_equals: none }
        - id: injury_description
          label: Describe what you saw
          type: textarea
          required: false
          placeholder: Anything that would help a researcher recognise it
          show_when: { field: injury_severity, not_equals: none }
    - id: water
      label: Water
      fields:
        - id: temperature
          label: Water temperature
          type: number
          required: false
          step: 0.1
          units:
            - { id: c, label: °C }
            - { id: f, label: °F }
          default_unit: c
    - id: about_you
      label: About you
      help: We use these details to credit the sighting and return results.
      fields:
        - id: submitter_name
          label: Your name
          type: text
          required: true
          autocomplete: name
        - id: submitter_email
          label: Your email
          type: email
          required: true
          autocomplete: email
          help: For the result and re-sight emails.
        - id: photographer_name
          label: Photographer name, if different
          type: text
          required: false
        - id: photographer_email
          label: Photographer email, if different
          type: email
          required: false
        - id: inform_other
          label: Also inform these emails
          type: email
          required: false
          multiple: true
          placeholder: Separate addresses with commas
        - id: comments
          label: Additional comments
          type: textarea
          required: false
          placeholder: Anything else the research team should know
        - id: consent
          label: Photo use
          type: chips
          required: true
          multiple: true
          options:
            - { id: agreed, label: I agree the photos can be used for research and shown on Sharkbook with my name on them }
fields:
  - id: observation_mode
    label: Seen how
    help: "Which channel this row comes from (METHOD 3.6): an in-water note usually wins on presence, a photograph on precise location and severity."
    required: true
    options:
      - { id: in_water, label: In the water }
      - { id: from_boat, label: From the boat }
      - { id: photograph_only, label: Photograph only }
  - id: description
    label: Observer description, verbatim
    type: text
    help: "What the person who saw the shark wrote or said. Code the fields below from it; never edit it."
    required: false
  - id: body_region
    label: Body region
    required: true
    options:
      - { id: head, label: Head }
      - { id: gills, label: Gills }
      - { id: mouth, label: Mouth }
      - { id: dorsal_fin_1, label: "1st dorsal fin" }
      - { id: dorsal_fin_2, label: "2nd dorsal fin" }
      - { id: pectoral_fin, label: Pectoral fin }
      - { id: pelvic_fin, label: Pelvic fin }
      - { id: claspers, label: Claspers }
      - { id: flank_anterior, label: "Anterior flank", help: "Side of the body ahead of the 1st dorsal fin." }
      - { id: flank_posterior, label: "Posterior flank", help: "Side of the body from the 1st dorsal fin back." }
      - { id: ventral_surface, label: Ventral surface, help: "Underside of the body." }
      - { id: caudal_peduncle, label: Caudal peduncle }
      - { id: caudal_fin, label: Caudal fin }
  - id: region_detail
    label: Side or edge
    help: "Left / right for flanks and pectoral fins; leading edge, trailing edge or tip for the 1st dorsal; upper or lower lobe for the caudal fin."
    required: false
    options:
      - { id: left, label: Left }
      - { id: right, label: Right }
      - { id: leading_edge, label: Leading edge }
      - { id: trailing_edge, label: Trailing edge }
      - { id: tip, label: Tip }
      - { id: upper_lobe, label: Upper lobe }
      - { id: lower_lobe, label: Lower lobe }
  - id: anthropogenic
    label: Anthropogenic
    help: "Is this scar human-caused? Abrasions are their own class and stay out of the headline figure (METHOD 3.2)."
    required: true
    default: unknown
    options:
      - { id: "yes", label: "Yes (Y)", help: "Clearly human-caused: a cause is named or unmistakable (propeller, rope/net, hook, boat paint, knife, tag).", emphasis: true }
      - { id: abrasion, label: "Abrasion / contact (A)", help: "Abrasions, scrapes, missing denticles, scratches with no named cause. Reported separately." }
      - { id: natural, label: "Natural (N)", help: "Shark bite, predator, cookiecutter, healed natural wound, or not a scar at all (pigment, deformity)." }
      - { id: unknown, label: "Unknown (U)", help: "Cannot tell from the record. Say why in the notes." }
  - id: threat
    label: Threat
    help: "What kind of human activity."
    required: true
    default: unknown
    options:
      - { id: vessel, label: "Vessel (V)" }
      - { id: fisheries, label: "Fisheries (F)", help: "Net, rope, line, hook, entanglement." }
      - { id: human_other, label: "Other / unspecified human (H)" }
      - { id: scientific, label: "Scientific (Sc)", help: "Tags, tethers, biopsy, clamps." }
      - { id: natural, label: "Natural (N)" }
      - { id: contact, label: "Contact / abrasion (C)" }
      - { id: unknown, label: "Unknown (U)" }
  - id: cause
    label: Cause
    help: "The mechanism. Where the observer only gave a wound word (nick, cut, notch, missing tip), choose 'Cut of unstated origin' and do not upgrade it (METHOD 3.1)."
    required: true
    default: unknown
    options:
      - { id: strike, label: "Strike, blunt (S)" }
      - { id: propeller, label: "Propeller (P)", help: "Parallel sharp lacerations." }
      - { id: entanglement, label: "Entanglement (E)", help: "Rope, net or line marks encircling peduncle, fin or body." }
      - { id: cut_unstated, label: "Cut of unstated origin (K)", help: "Cut, laceration, notch, nick or missing tip with no cause named." }
      - { id: human_other, label: "Other human (H)" }
      - { id: scientific, label: "Scientific (Sc)" }
      - { id: natural, label: "Natural (N)" }
      - { id: contact, label: "Contact / abrasion (C)" }
      - { id: unknown, label: "Unknown (U)" }
  - id: confidence
    label: Cause confidence
    help: "How certain the CAUSE attribution is, not whether the scar exists."
    required: true
    default: possible
    options:
      - { id: confirmed, label: "1 Confirmed", help: "The record states the cause unambiguously ('propeller cuts', 'rope still attached')." }
      - { id: probable, label: "2 Probable", help: "Strong wording ('rope mark on peduncle', 'boat paint')." }
      - { id: possible, label: "3 Possible", help: "Wound described, cause inferred." }
      - { id: unknown, label: "4 Unknown" }
  - id: severity
    label: Severity
    required: true
    options:
      - { id: major, label: Major, help: "Amputation, missing fin tip or lobe, deep or fresh open wound.", emphasis: true }
      - { id: moderate, label: Moderate, help: "Cuts, notches, nicks, healed lacerations." }
      - { id: minor, label: Minor, help: "Abrasions, scratches, scrapes, small marks." }
  - id: healing_stage
    label: Healing stage
    help: "Optional; proposed to the method as an extra axis. Judge by TISSUE STATE (Womersley et al. 2021), not colour: colour shifts from red/pink to white to dark are common but are not the criterion."
    required: false
    options:
      - { id: open, label: Open, help: "Any tissue other than the epidermis is visible (exposed white hypodermis is still open)." }
      - { id: closing, label: Closing, help: "Wound margins contracting; epidermis re-forming over part of the area." }
      - { id: healed, label: Healed, help: "Epidermis re-formed over the whole area; a closed scar, whatever its colour." }
  - id: n_scars
    label: Number of distinct scars in this row
    type: number
    help: "Usually 1. An unnumbered plural ('several notches') is one group: enter 1 and say so in the notes."
    required: true
    default: "1"
  - id: notes
    label: Coder notes
    type: text
    help: "Why you coded it this way, and anything ambiguous (METHOD 3.5: ambiguity is recorded, not resolved)."
    required: false
